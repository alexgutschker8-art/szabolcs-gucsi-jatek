<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Szabolcs & Gucsi – Kisvárosi káosz</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:system-ui,Arial;color:white}#hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}#title{font-weight:900;letter-spacing:.04em;font-size:clamp(15px,3vw,24px)}#mission{background:#111c;padding:10px 14px;border:1px solid #ffffff55;border-radius:12px;font-size:13px;max-width:55vw}#help{position:fixed;bottom:12px;left:12px;background:#111c;border:1px solid #ffffff55;padding:9px 12px;border-radius:10px;font-size:12px}#touch{position:fixed;right:14px;bottom:16px;display:grid;grid-template-columns:repeat(3,54px);gap:6px}button{border:1px solid #ffffff77;background:#172333cc;color:white;border-radius:12px;font-size:20px;width:54px;height:48px;touch-action:none}#touch .wide{grid-column:span 3;width:100%;font-size:13px}#start{position:fixed;inset:0;background:linear-gradient(#07111dcc,#07111d99),radial-gradient(ellipse at center,#496277,#101820);display:grid;place-items:center;text-align:center}#panel{padding:28px;max-width:520px}h1{font-size:clamp(30px,7vw,58px);line-height:.95;margin:0 0 12px}#start p{color:#d5e1ea}#start button{width:auto;height:auto;padding:14px 25px;background:#e6ad38;color:#171717;font-weight:900;font-size:17px;border:0;margin-top:12px}
</style></head><body>
<div id="hud"><div id="title">SZABOLCS & GUCSI<br><small>KISVÁROSI KÁOSZ · PROTOTÍPUS</small></div><div id="mission">KÜLDETÉS 01<br>Találkozz Szabolccsal a főtéren!</div></div>
<div id="help">PC: WASD / nyilak · SPACE: ugrás · E: beszállás</div>
<div id="touch"><button data-k="ArrowUp">▲</button><button data-k="Space">⤒</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button class="wide" data-k="KeyE">AUTÓBA BE / KI</button></div>
<div id="start"><div id="panel"><h1>SZABOLCS<br>& GUCSI</h1><p>Üdv a kisvárosi káoszban! Ez az első játszható 3D-s prototípus.</p><p>Indulj el a főtéren, keresd meg Szabolcsot, és próbáld ki az autót!</p><button id="go">JÁTÉK INDÍTÁSA</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc5df);scene.fog=new THREE.Fog(0x9bc5df,45,150);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x59604b,2));const sun=new THREE.DirectionalLight(0xffe0b0,2.2);sun.position.set(-25,45,25);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x78966b));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,sx,sy,sz,color){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
// streets and square
box(0,.03,0,18,.06,150,0x55585a);box(0,.04,0,150,.06,18,0x55585a);box(0,.08,0,22,.08,22,0xb5aa91);
for(let i=-5;i<=5;i++){box(i*12,.05,-34,7,.1,7,0x77736b);box(i*12,.05,34,7,.1,7,0x77736b)}
// houses around town
const colors=[0xd7b58c,0xe5d8bc,0xc47f64,0xd7d1bd,0xb8c4a1,0xd6b7a0];
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)<2&&Math.abs(z)<2)continue;if(Math.random()<.24)continue;let px=x*17+(Math.random()-.5)*3,pz=z*17+(Math.random()-.5)*3;let w=7+Math.random()*3,h=5+Math.random()*5,d=7+Math.random()*3;box(px,h/2,pz,w,h,d,colors[Math.floor(Math.random()*colors.length)]);let roof=box(px,h+1.1,pz,w+1,2.2,d+1,0x70483b);roof.rotation.z=(Math.random()-.5)*.08;box(px,h*.52,pz+d/2+.04,1.3,2,0.1,0x4b3026)}
// church and tower
box(-12,5,-12,8,10,7,0xd9c59e);box(-12,13,-12,3,8,3,0xd5c09b);let sp=new THREE.Mesh(new THREE.ConeGeometry(2.4,4,4),mat(0x526b62));sp.position.set(-12,19,-12);scene.add(sp);
// trees
for(let i=0;i<35;i++){let x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.abs(x)<13||Math.abs(z)<13)continue;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),mat(0x60432c));trunk.position.set(x,1,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.8,10,8),mat(0x47744a));crown.position.set(x,3,z);scene.add(crown)}
function person(x,z,shirt,pants){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.95,5,10),mat(shirt));body.position.y=1.35;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),mat(0xe1b18e));head.position.y=2.25;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.39,12,8),mat(0x241d1b));hair.position.set(0,2.48,0);hair.scale.y=.65;g.add(hair);for(let s of [-1,1]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.8,.3),mat(pants));leg.position.set(s*.22,.45,0);g.add(leg)}g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);return g}
const player=person(0,8,0xd7c7aa,0x27364b);const friend=person(5,1,0x9b3430,0x20242a);
// car
const car=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,4.2),mat(0x172a38,.35));chassis.position.y=.75;car.add(chassis);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,2),mat(0x263f50,.25));cabin.position.set(0,1.4,-.25);car.add(cabin);for(let x of [-1,1])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,.42,z);car.add(w)}car.position.set(4,0,9);scene.add(car);
let keys={},inCar=false,vel=0;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')toggleCar()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});function toggleCar(){if(player.position.distanceTo(car.position)<3||inCar){inCar=!inCar;if(inCar)player.visible=false;else{player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(2,0,0))}}}
document.getElementById('go').onclick=()=>document.getElementById('start').style.display='none';
let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),turn=(keys.KeyA||keys.ArrowLeft?1:0)-(keys.KeyD||keys.ArrowRight?1:0);if(inCar){vel+=(forward*18-vel*2.5)*dt;car.rotation.y+=turn*dt*1.8*Math.max(.35,Math.abs(vel)/5);car.translateZ(-vel*dt)}else{if(forward||turn){player.rotation.y+=turn*dt*2.5;player.translateZ(-forward*dt*5)}if(keys.Space&&player.position.y<.02)player.userData.jump=5;if(player.userData.jump){player.position.y+=player.userData.jump*dt;player.userData.jump-=14*dt;if(player.position.y<0)player.position.y=0}}
let target=inCar?car:player;let desired=new THREE.Vector3(0,5,10).applyAxisAngle(new THREE.Vector3(0,1,0),target.rotation.y).add(target.position);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.position.x,target.position.y+1.2,target.position.z);if(friend.position.distanceTo(player.position)>4&&!inCar){friend.position.lerp(player.position.clone().add(new THREE.Vector3(2,0,2)),dt*.15)}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
